<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="Dancing">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="360" height="360" rx="28" fill="#0b1020"/>
  <circle cx="180" cy="180" r="132" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <circle cx="180" cy="180" r="96" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.28"/>
  <g stroke="url(#g)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.9">
    <g>
      <circle cx="180" cy="106" r="20" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 180 180;6 180 180;-6 180 180" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <line x1="180" y1="128" x2="180" y2="196">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <g>
      <line x1="180" y1="146" x2="138" y2="126"/>
      <animateTransform attributeName="transform" type="rotate" values="-28 180 146;24 180 146;-28 180 146" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="180" y1="146" x2="222" y2="166"/>
      <animateTransform attributeName="transform" type="rotate" values="24 180 146;-28 180 146;24 180 146" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="180" y1="196" x2="148" y2="248"/>
      <animateTransform attributeName="transform" type="rotate" values="18 180 196;-18 180 196;18 180 196" dur="0.7s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="180" y1="196" x2="212" y2="248"/>
      <animateTransform attributeName="transform" type="rotate" values="-18 180 196;18 180 196;-18 180 196" dur="0.7s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#00d9ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700">
    <text x="64" y="96">♪</text>
    <text x="286" y="120">♫</text>
    <text x="274" y="272">♪</text>
  </g>
</svg>
